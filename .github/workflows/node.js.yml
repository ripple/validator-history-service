name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run build
      - run: npm test
        env:
          # The hostname used to communicate with the PostgreSQL service container
          POSTGRES_HOST: postgres
          # The default PostgreSQL port
          POSTGRES_PORT: 5432
          # Database connection info
          DB_HOST: 'localhost'
          DB_USER: 'postgres'
          DB_DATABASE: 'postgres'
          DB_PASSWORD: 'postgres'
          # Rippled Server with access to manifest command
          RIPPLED_RPC_ADMIN: 'https://xrpl.ws/'
          # (Placeholder) Mainnet entry point for crawler (without https://).
          MAINNET_P2P_ENTRY: 'test.example.com'

  security-audit:
    name: Security audit (production deps)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          # Tracks the current Node.js LTS (Node 24 at time of writing)
          node-version: lts/*
      # npm audit resolves the dependency graph straight from package-lock.json,
      # so no `npm ci` / node_modules install is needed here.
      # --registry pins the advisory source to the public npm registry (the
      # canonical GitHub Advisory DB);
      - name: Fail on high/critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high --registry https://registry.npmjs.org/
      - name: Full audit (informational — never fails the build)
        if: always()
        run: npm audit --registry https://registry.npmjs.org/ || true
